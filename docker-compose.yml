services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctechproject_app
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    environment:
      APP_NAME: "DentaFlow"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:0W9N4i59H18a9wUFh/B4D+PePf0PGIeSBzf5XOy1emg="
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: doctechproject
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
    # Optionally mount a custom .env file instead of the environment block above:
    # env_file:
    #   - .env

  mysql:
    image: mysql:8.4
    container_name: doctechproject_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"       # expose to host for tools like TablePlus / DBeaver
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: doctechproject
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "laravel", "--password=secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  storage_data:
  mysql_data:
